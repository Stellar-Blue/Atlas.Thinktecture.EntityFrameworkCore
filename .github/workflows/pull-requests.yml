name: Pull Requests Draft
on:
  push:
    branches:
      - eng-*

permissions:
  contents: write
  pull-requests: write

jobs:
  pull-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pull-request-main
        uses: diillson/auto-pull-request@v1.0.1
        with:
          destination_branch: "main"
          pr_title: "[Main] ${{ github.event.head_commit.message }}"
          pr_draft: true
      - name: pull-request-qa
        uses: diillson/auto-pull-request@v1.0.1
        with:
          destination_branch: "deployment-qa"
          pr_title: "[QA] ${{ github.event.head_commit.message }}"
          pr_draft: true
